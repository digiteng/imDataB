name: IMDb Auto DB Updater

on:
  schedule:
    - cron: '0 0 * * 0' # Her Pazar saat 00:00'da çalışır
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Veritabanı Oluştur
      run: python convert.py

    - name: Güncel Tarih Bilgisi Al
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: DB Dosyasını GitHub Releases'e Yükle
      uses: softprops/action-gh-release@v2
      with:
        files: imdb_complete.db
        tag_name: v-${{ steps.date.outputs.date }}
        name: IMDb Database (${{ steps.date.outputs.date }})
        body: Enigma2 için haftalık güncellenen hızlı SQLite veritabanı.
